server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy for CORS bypass
    location ~ ^/proxy/(.*)$ {
        resolver 8.8.8.8;
        proxy_pass $1;
        
        # Determine host from the target URL
        # nginx proxy_pass automatically handles host if $1 is a valid URL, 
        # but just to be safe we can clear the client Host header
        proxy_set_header Host $proxy_host;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' '*';
        
        # Strip referer to avoid being blocked by strict CDNs
        proxy_set_header Referer "";
        proxy_set_header Origin "";
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
